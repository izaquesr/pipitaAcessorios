<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Pipita</title>
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/header.css">
<link rel="stylesheet" href="../css/home.css">
<link rel="stylesheet" href="../css/cart.css">
<link rel="stylesheet" href="../css/account.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<a href="#main" class="skip-link">Pular para o conteúdo</a>
<div data-slot="header" id="siteHeaderSlot"></div>

<main id="main">
  <div class="account-wrap">
    <span class="eyebrow" style="display:block;text-align:center">Bem-vinda de volta</span>
    <h1>Entrar na sua conta</h1>
    <p class="text-muted">Acesse seus pedidos, favoritos e endereços salvos.</p>

    <form class="account-form" id="loginForm">
      <div class="field">
        <label for="loginEmail">E-mail</label>
        <input type="email" id="loginEmail" required placeholder="voce@email.com">
      </div>
      <div class="field">
        <label for="loginPass">Senha</label>
        <input type="password" id="loginPass" required placeholder="••••••••" minlength="6">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Entrar</button>
    </form>
    <p class="account-alt">Novo por aqui? <a href="cadastro.html">Crie sua conta</a></p>
  </div>
</main>

<div data-slot="footer" id="siteFooterSlot"></div>

<script src="../js/data.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/favorites.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/search.js"></script>
<script src="../js/layout.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", e => {
  e.preventDefault();
  showToast("Login simulado com sucesso! (sem backend real neste demo)");
});
</script>
</body>
</html>
