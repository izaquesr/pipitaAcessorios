<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categoria — Pipita</title>
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/header.css">
<link rel="stylesheet" href="../css/home.css">
<link rel="stylesheet" href="../css/category.css">
<link rel="stylesheet" href="../css/product.css">
<link rel="stylesheet" href="../css/cart.css">
<link rel="stylesheet" href="../css/account.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<a href="#main" class="skip-link">Pular para o conteúdo</a>
<div data-slot="header" id="siteHeaderSlot"></div>

<main id="main">
  <div class="container category-head">
    <nav class="breadcrumb"><a href="../index.html">Início</a><span>›</span><span id="pageCrumb">Todas as joias</span></nav>
    <span class="eyebrow">Loja</span>
    <h2 id="pageTitle" style="margin-top:6px">Todas as joias</h2>
    <p id="pageSubtitle">Peças selecionadas para você.</p>
  </div>

  <div class="container" id="categoryListing">
    <div class="filter-bar">
      <div class="filter-chips" id="filterChips"></div>
      <div class="filter-sort">
        <span class="result-count" id="resultCount"></span>
        <select id="sortSelect" aria-label="Ordenar por">
          <option value="relevance">Relevância</option>
          <option value="newest">Mais recentes</option>
          <option value="price-asc">Menor preço</option>
          <option value="price-desc">Maior preço</option>
          <option value="rating">Melhor avaliados</option>
        </select>
      </div>
    </div>
    <div class="product-grid" id="categoryGrid"></div>
  </div>

  <section class="container section-tight is-hidden" id="collectionsSection">
    <div class="collections-grid" id="collectionsGrid"></div>
  </section>
</main>

<div data-slot="footer" id="siteFooterSlot"></div>

<script src="../js/data.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/favorites.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/search.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/category-page.js"></script>
</body>
</html>
